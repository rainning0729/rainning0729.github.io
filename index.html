<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>表格图标计数</title>
<style>
table {
    border-collapse: collapse;
    border: none;
}

td {
    width: 60px;
    height: 60px;
    border: none;
    text-align: center;
    vertical-align: middle;
    font-size: 18px;
    padding: 4px;
}

.num-cell {
    width: 100%;
    height: 100%;
    border: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
}

.num-cell span {
    position: relative;
    z-index: 2;
    font-size: 24px;
    font-weight: bold;
}

.num-cell.has-hline::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    height: 3px;
    background: #fff;
    z-index: 1;
}

.num-cell.has-vline::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    background: #fff;
    z-index: 1;
}

.icon-cell {
    width: 100%;
    height: 100%;
    background: #888;
    border-radius: 8px;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    box-sizing: border-box;
}

.icon-line {
    width: 36px;
    height: 4px;
    background: #000;
    border-radius: 2px;
    transform-origin: center;
    transition: transform 0.15s ease;
}
</style>
</head>
<body>

<table id="mainTable">
    <tr data-row="0">
        <td data-col="0"><div class="num-cell"><span>0</span></div></td>
        <td data-col="1"><div class="num-cell"><span>0</span></div></td>
        <td data-col="2">
            <div class="icon-cell" onclick="toggleIcon(this)">
                <div class="icon-line"></div>
            </div>
        </td>
        <td data-col="3"><div class="num-cell"><span>0</span></div></td>
        <td data-col="4"><div class="num-cell"><span>0</span></div></td>
    </tr>
    <tr data-row="1">
        <td data-col="0"><div class="num-cell"><span>0</span></div></td>
        <td data-col="1">
            <div class="icon-cell" onclick="toggleIcon(this)">
                <div class="icon-line"></div>
            </div>
        </td>
        <td data-col="2"><div class="num-cell"><span>0</span></div></td>
        <td data-col="3">
            <div class="icon-cell" onclick="toggleIcon(this)">
                <div class="icon-line"></div>
            </div>
        </td>
        <td data-col="4"><div class="num-cell"><span>0</span></div></td>
    </tr>
    <tr data-row="2">
        <td data-col="0">
            <div class="icon-cell" onclick="toggleIcon(this)">
                <div class="icon-line"></div>
            </div>
        </td>
        <td data-col="1"><div class="num-cell"><span>0</span></div></td>
        <td data-col="2"><div class="num-cell"><span>0</span></div></td>
        <td data-col="3"><div class="num-cell"><span>0</span></div></td>
        <td data-col="4">
            <div class="icon-cell" onclick="toggleIcon(this)">
                <div class="icon-line"></div>
            </div>
        </td>
        <td data-col="5"><div class="num-cell"><span>0</span></div></td>
    </tr>
    <tr data-row="3">
        <td data-col="0"><div class="num-cell"><span>0</span></div></td>
        <td data-col="1">
            <div class="icon-cell" onclick="toggleIcon(this)">
                <div class="icon-line"></div>
            </div>
        </td>
        <td data-col="2"><div class="num-cell"><span>0</span></div></td>
        <td data-col="3">
            <div class="icon-cell" onclick="toggleIcon(this)">
                <div class="icon-line"></div>
            </div>
        </td>
        <td data-col="4"><div class="num-cell"><span>0</span></div></td>
    </tr>
    <tr data-row="4">
        <td data-col="0"><div class="num-cell"><span>0</span></div></td>
        <td data-col="1"><div class="num-cell"><span>0</span></div></td>
        <td data-col="2">
            <div class="icon-cell" onclick="toggleIcon(this)">
                <div class="icon-line"></div>
            </div>
        </td>
        <td data-col="3"><div class="num-cell"><span>0</span></div></td>
        <td data-col="4"><div class="num-cell"><span>0</span></div></td>
    </tr>
</table>

<script>
function initIcons() {
    const iconCells = document.querySelectorAll('.icon-cell');
    iconCells.forEach(cell => {
        cell.dataset.rotated = 'false';
        cell.querySelector('.icon-line').style.transform = 'rotate(0deg)';
    });
}

function toggleIcon(cell) {
    const line = cell.querySelector('.icon-line');
    cell.dataset.rotated = cell.dataset.rotated === 'true' ? 'false' : 'true';
    line.style.transform = cell.dataset.rotated === 'true' ? 'rotate(90deg)' : 'rotate(0deg)';
    recalculateAll();
}

function recalculateAll() {
    const table = document.getElementById('mainTable');
    if (!table) return;
    const allRows = table.querySelectorAll('tr');

    allRows.forEach(tr => {
        const rowIcons = tr.querySelectorAll('.icon-cell');
        const hasRow0 = Array.from(rowIcons).some(i => i.dataset.rotated === 'false');
        const rowCells = tr.querySelectorAll('td');
        rowCells.forEach(td => {
            if (td.querySelector('.icon-cell')) return;
            const numBox = td.querySelector('.num-cell');
            const colIdx = td.dataset.col;
            const colIcons = table.querySelectorAll(`td[data-col="${colIdx}"] .icon-cell`);
            const hasCol90 = Array.from(colIcons).some(i => i.dataset.rotated === 'true');
            const countCol90 = Array.from(colIcons).filter(i => i.dataset.rotated === 'true').length;
            const countRow0 = Array.from(rowIcons).filter(i => i.dataset.rotated === 'false').length;
            const total = countRow0 + countCol90;
            numBox.querySelector('span').textContent = total;

            if (total === 0) {
                numBox.style.backgroundColor = '#ffd900';
            } else if (total === 1) {
                numBox.style.backgroundColor = '#4488dd';
            } else {
                numBox.style.backgroundColor = '#dd4444';
            }

            numBox.classList.toggle('has-hline', hasRow0);
            numBox.classList.toggle('has-vline', hasCol90);
        });
    });
}

document.addEventListener('DOMContentLoaded', () => {
    initIcons();
    recalculateAll();
});
</script>

</body>
</html>
